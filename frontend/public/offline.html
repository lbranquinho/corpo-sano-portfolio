<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E3A8A" />
    <title>Corpo Sano — sem conexão</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
             background: #fff; color: #0f172a; padding: 24px; box-sizing: border-box; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #020617; color: #e2e8f0; } p { color: #94a3b8 !important; } }
      img { width: 72px; height: 72px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 auto; max-width: 320px; color: #475569; line-height: 1.5; }
      a { display: inline-block; margin-top: 20px; padding: 10px 20px; border-radius: 10px;
          background: #2563EB; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Sem conexão com a internet</h1>
      <p>O Corpo Sano precisa de internet para mostrar os dados da clínica. Verifique o Wi-Fi ou os dados móveis e tente de novo.</p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
